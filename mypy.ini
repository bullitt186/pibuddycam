# mypy over app/ (repo-kit CI standard, category 3). Run: mypy (from the repository root).
#
# Strict for every module, with one baseline: app/ was written without type annotations, so
# each existing module is relaxed only in the strict options it broke when the type check was
# introduced (#14); the sections below list them. New modules are fully strict. When you add
# annotations to a module, drop its relaxations; never add a module to a section.
[mypy]
files = app
mypy_path = app
explicit_package_bases = True
python_version = 3.12
warn_unused_configs = True
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
no_implicit_reexport = True
strict_equality = True
extra_checks = True

# PyGObject (GStreamer, NetworkManager) comes from Debian packages and has no stubs on the host;
# python-socketio ships no type information.
[mypy-gi,gi.*,socketio]
ignore_missing_imports = True

[mypy-mqtt_service]
check_untyped_defs = False
disallow_any_generics = False
disallow_incomplete_defs = False
disallow_untyped_defs = False

[mypy-stream_mux]
check_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_untyped_defs = False
# A module-level dict without annotation (var-annotated); fix when the module is next changed.
disable_error_code = var-annotated

[mypy-factory_reset]
check_untyped_defs = False
disallow_any_generics = False
disallow_untyped_defs = False

[mypy-admin_http]
check_untyped_defs = False
disallow_any_generics = False
disallow_untyped_defs = False
# None assigned to an attribute declared float (assignment); fix when the module is next changed.
disable_error_code = assignment

[mypy-admin_app,gpio_selftest,main,mqtt_probe]
check_untyped_defs = False
disallow_untyped_calls = False
disallow_untyped_defs = False

[mypy-camera_probe,expert_config,settings_coordinator,trigger,updater]
disallow_any_generics = False
disallow_untyped_calls = False
disallow_untyped_defs = False

# update_control imports `updater` through updater_install, which does not list it in __all__.
[mypy-updater_install]
disallow_any_generics = False
disallow_untyped_calls = False
disallow_untyped_defs = False
implicit_reexport = True

[mypy-admin_auth,admin_http_media,admin_http_network,admin_http_settings,admin_http_system,local_webrtc,network_settings,onvif_facade,ota,settings_dispatch,setup_wizard,webrtc]
check_untyped_defs = False
disallow_untyped_defs = False

[mypy-config_schema]
check_untyped_defs = False
disallow_untyped_defs = False
# A module-level dict without annotation (var-annotated); fix when the module is next changed.
disable_error_code = var-annotated

[mypy-admin_tls,app_metrics,app_version,boot_mode,camera,camera_source,dashboard,data_ready,device_control,diagnostics,gpio_trigger,hotspot,hotspot_ctl,http_result,identity,image_guard,info_body,info_service,live_monitor,local_http,media_build,media_library,migrations,mqtt_state,mqtt_topics,network,network_apply,network_watchdog,ntp_apply,onvif_discovery,persist_restore,privileged,proto,provisioning,quality,quality_control,recovery,rotation,rtsp_control,runtime_ipc,sdp_mids,settings_store,ssh_control,state,status,timelapse,timezone,upload,webrtc_control,wifi_station]
disallow_untyped_calls = False
disallow_untyped_defs = False

[mypy-update_control]
disallow_untyped_calls = False
disallow_untyped_defs = False

[mypy-signaling]
disallow_untyped_calls = False
disallow_untyped_defs = False

[mypy-rtsp_server]
disallow_untyped_calls = False

[mypy-auth,gpio_pins,local_webrtc_signaling,rtsp_config,scheduling,webrtc_lifecycle]
disallow_untyped_defs = False
