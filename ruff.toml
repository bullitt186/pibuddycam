# Ruff lint and format (repo-kit CI standard, category 2). Run: python3 scripts/check_lint.py
line-length = 100
target-version = "py312"
# app/ is run with app/ on sys.path, so its modules import each other as top-level names.
src = ["app", "."]
extend-exclude = ["_archive", "research"]

[format]
# The code uses single quotes throughout; the formatter keeps what is written.
quote-style = "preserve"

[lint]
select = ["E4", "E7", "E9", "F", "W", "B", "UP", "I"]

# Baseline of the runtime code when lint was introduced (#14): each existing app/ module is
# exempt only from the rules it broke then, so the device code was not changed by the CI
# change. New modules get every rule. Remove a module's entry when the module is next changed
# for its own reason and the findings are fixed with it; never add codes to an entry.
[lint.per-file-ignores]
"app/admin_app.py" = ["B904"]
"app/admin_auth.py" = ["UP032"]
"app/admin_http.py" = ["F401", "I001"]
"app/admin_http_media.py" = ["I001"]
"app/admin_http_network.py" = ["I001"]
"app/admin_http_settings.py" = ["I001"]
"app/admin_http_system.py" = ["I001"]
