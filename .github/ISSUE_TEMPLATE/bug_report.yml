name: Bug report
description: Something on the device or in the docs doesn't work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please **redact** tokens, Wi-Fi names, IP/MAC addresses and hostnames.
        Security problems go to a private advisory instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: Web console → System → Health & version (application and image version).
      placeholder: "1.4.0 (image 1.4.0)"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      placeholder: "Pi Zero 2 W, OV5647, 16 GB card"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste or attach the redacted diagnostics from System → Diagnostics.
      render: text
