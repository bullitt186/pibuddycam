name: CI

on:
  # branches-only so a tag push does not run this twice (release.yml owns tags).
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  host-gate:
    name: host regression gate (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The application is stdlib-only. PyYAML and the tools below are only
      # needed so the image config, signature (minisign) and boot-partition
      # tests run instead of being skipped on the hosted runner.
      - name: Install test-only dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign mtools dosfstools zstd
          python3 -m pip install PyYAML==6.0.2

      # aiohttp is a runtime dependency, not stdlib: install it (pinned by the
      # image lock, hash-checked) so the tests that drive the real HTTP routes run
      # instead of being skipped. Best effort: without it those tests skip.
      - name: Install the runtime lock (optional)
        run: python3 -m pip install --require-hashes -r image/requirements.lock || echo "runtime lock not installable on this runner; aiohttp tests will skip"

      - name: Unit tests
        run: python3 -m unittest discover -s tests -t .

      - name: Byte-compile app and tests
        run: python3 -m compileall -q app tests

      - name: Shell syntax (app + image scripts)
        run: |
          status=0
          for f in image/scripts/*.sh app/*.sh image/assets/*.sh \
                   image/assets/pibuddycam-priv \
                   image/assets/networkmanager/dispatcher.d/*; do
            echo "bash -n $f"
            bash -n "$f" || status=1
          done
          exit "$status"

      # Committed-secret gate: scan the files changed by this push/PR. Python
      # source is scanned with the high-signal source-tree mode; every other
      # changed file is scanned with the default artifact mode. tests/ and
      # docs/ are skipped because they intentionally contain synthetic secret
      # fixtures and redacted examples. Fails closed if the diff cannot be
      # computed.
      - name: Secret scan (changed files)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            range="origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              range="HEAD~1..HEAD"
            else
              range="${before}..${{ github.sha }}"
            fi
          fi
          if ! git diff --name-only -z --diff-filter=ACMR "$range" > changed.z 2>/dev/null; then
            echo "WARNING: could not diff $range; scanning the tip commit" >&2
            if ! git show --name-only --pretty=format: -z HEAD > changed.z 2>/dev/null; then
              echo "ERROR: could not enumerate changed files for $range" >&2
              exit 1
            fi
          fi
          mapfile -d '' -t changed < changed.z
          py=()
          other=()
          for f in "${changed[@]}"; do
            # Test directories, fixtures and docs (including archived docs)
            # carry intentional synthetic/example values; scan-secrets.sh
            # defines the patterns and image/README.md documents them, so
            # neither is content.
            case "$f" in
              tests/* | */tests/* | */fixtures/* | docs/* | _archive/docs/* \
                | image/scripts/scan-secrets.sh | image/README.md) continue ;;
            esac
            [ -f "$f" ] || continue
            # Program source and schemas (Python, Rust, protobuf) use the
            # high-signal source-tree mode; fields named token/password are
            # code, not secrets.
            case "$f" in
              *.py | *.rs | *.proto) py+=("$f") ;;
              *) other+=("$f") ;;
            esac
          done
          if [ "${#py[@]}" -gt 0 ]; then
            echo "scan-secrets (source): ${py[*]}"
            image/scripts/scan-secrets.sh --source-tree "${py[@]}"
          fi
          if [ "${#other[@]}" -gt 0 ]; then
            echo "scan-secrets (data): ${other[*]}"
            image/scripts/scan-secrets.sh "${other[@]}"
          fi
          if [ "${#py[@]}" -eq 0 ] && [ "${#other[@]}" -eq 0 ]; then
            echo "no changed files to scan"
          fi

      - name: Whitespace check
        run: git diff --check

  # The console's offline browser suite (Playwright + Chromium against the fake
  # runtime in tests/e2e/server.py). It needs no device and no network beyond the
  # package install, and E2E_REQUIRED=1 turns a missing browser into a failure
  # instead of a silent skip.
  console-e2e:
    name: console end-to-end (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the runtime lock
        run: python3 -m pip install --require-hashes -r image/requirements.lock

      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Console end-to-end suite
        env:
          E2E_REQUIRED: "1"
        run: NODE_PATH="$(npm root -g)" tests/e2e/run.sh

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: tests/e2e/.artifacts
          if-no-files-found: ignore
