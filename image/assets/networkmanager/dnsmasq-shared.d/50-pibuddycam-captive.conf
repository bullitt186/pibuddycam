# Captive portal for the setup hotspot (pibuddycam-setup).
#
# NetworkManager starts dnsmasq with --conf-dir=/etc/NetworkManager/dnsmasq-shared.d
# only for `ipv4.method shared` connections, and the setup AP is the only one on
# this appliance, so this file only applies while that hotspot is up. That is
# setup mode, or a claimed camera whose network watchdog or failed network
# change fell back to the hotspot.
#
# Answer every name with the portal address. Phones and laptops probe a known
# URL after joining a network (captive.apple.com, connectivitycheck.gstatic.com,
# www.msftconnecttest.com, detectportal.firefox.com); the setup server answers
# those with a redirect, which makes the OS open the setup page by itself. On a
# claimed camera the port-80 server (local_http) answers them with a page that
# points to the console.
address=/#/192.168.4.1

# Deliberately no RFC 8910 captive-portal URI (DHCP option 114): RFC 8908
# requires an https API whose certificate the client validates, which a
# self-signed certificate on 192.168.4.1 can never satisfy. The probes above
# are what opens the page.
